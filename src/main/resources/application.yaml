spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bujirun}
    username: ${DB_USERNAME:bujirun}
    password: ${DB_PASSWORD:bujirun}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    async:
      request-timeout: -1  # 타임아웃 없음
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 타임아웃 미설정 시 커넥션이 끊긴 채로 남아있으면 요청이 응답 없이 계속 걸릴 수 있다
      # (2026-09-16 로컬에서 Redis를 죽인 채로 재현 확인 — try/catch 폴백이 있어도 예외
      # 자체가 안 던져지고 그냥 멈춰있었음). 짧게 잡아서 장애 시 빨리 실패하고 폴백하게 한다.
      timeout: 1000ms
      connect-timeout: 1000ms

server:
  port: 8080

tourapi:
  service-key: ${TOURAPI_SERVICE_KEY}

busan-attraction-api:
  service-key: ${BUSAN_ATTRACTION_API_SERVICE_KEY}

groq:
  api:
    key: ${GROQ_API_KEY}
    model: openai/gpt-oss-120b

odsay:
  api:
    key: ${ODSAY_API_KEY}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  admin-key: ${KAKAO_ADMIN_KEY}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:bujirun-storage}
    region: ${AWS_REGION:ap-northeast-2}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

openai:
  api:
    key: ${OPENAI_API_KEY}
    model: gpt-4.1-mini

internal:
  api:
    # node-yjs 서버가 room의 flush를 대신 호출할 때 쓰는 서버 간 공유 비밀값.
    # 비어있으면(로컬에서 안 쓸 때) InternalAuthFilter가 항상 거부한다 — 빈 문자열끼리
    # 매치돼 인증이 뚫리는 걸 막기 위함.
    secret: ${INTERNAL_API_SECRET:}